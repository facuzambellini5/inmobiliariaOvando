spring.application.name=InmobiliariaOvando

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

#JWT Configuration
jwt.secret=${JWT_SECRET}
# VER TIEMPO DE EXPIRACIÓN PARA QUE DURE UNA JORNADA DE TRABAJO
jwt.expiration-ms=${JWT_EXPIRATION_MS}

#Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Límite por archivo y por request completo. 10MB es de sobra para una
# foto de celular sin comprimir; esto corta uploads gigantes ANTES de
# que lleguen al controller.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Para crear el usuario admin la primera vez (o uno nuevo el día de mañana)
admin.seed.username=${ADMIN_SEED_USERNAME:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}


#LOGS
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web=DEBUG

